[stereo]
; D3D-level camera patching (proxy). Off: replaced by engine-camera shift.
enabled=0
amp_units=30
period_sec=4

[engine]
; Engine camera (F4SE plugin fo4flat_probe.dll). mode=stereo alternates eyes, mode=wobble = sway test
enabled=1
mode=stereo
; 64 mm IPD in FO4 units (1 unit ~= 1.43 cm)
ipd_units=4.48
amp_units=30
period_sec=4

[vr]
; Submit frames to SteamVR (proxy d3d11.dll)
enabled=1
; eye_delay=1 if the eyes look mismatched / depth wrong; swap_eyes=1 if depth is inverted
eye_delay=0
swap_eyes=0
wait_poses=1
