[stereo]
; D3D-level camera patching (proxy). Off: replaced by engine-camera shift.
enabled=0
amp_units=30
period_sec=4

[engine]
; Engine camera (F4SE plugin fo4flat_probe.dll). mode=stereo alternates eyes, mode=wobble = sway test
enabled=1
mode=stereo
; 64 mm IPD = 4.48 FO4 units (1 unit ~= 1.43 cm). 9 = doubled for testing that the eyes differ
ipd_units=4.48
amp_units=30
period_sec=4
; eye offset method: 4 = offset the render camera (camera root child, default), 1 = subtract previous offset, 3 = restore camera root, 0 = none
compensate=4
; head rotation: 0 off, 1 camera*head, 2 head*camera (try 2 if turning feels wrong)
head_rotation=1
; 1 = remove last frame head rotation (only if turning makes the view spin)
head_rot_compensate=0
; head position (6DoF), FO4 units per metre
head_position=1
units_per_meter=70
; eye separation while aiming (0 = mono, avoids double vision of the sights)
aim_ipd_scale=0

[vr]
; Submit frames to SteamVR (proxy d3d11.dll)
enabled=1
; eye_delay=1 if the eyes look mismatched / depth wrong; swap_eyes=1 if depth is inverted
eye_delay=1
swap_eyes=0
wait_poses=1
; menus, intro and loading are shown on a 2D screen after this many frames without camera updates
flat_after_frames=20
screen_width_m=3.0
screen_distance_m=2.0
; map the game image onto each eye using the headset FOV (texture bounds)
fov_bounds=1
; drop the game vsync (sync interval 2 = 30 fps) while VR runs; the headset paces frames instead
no_vsync=1
; write the game window size and FOV for the connected headset into Fallout4Prefs/Custom.ini (applies next start)
auto_configure=1
; game FOV narrower than aim_ratio x headset FOV = aiming (mono); narrower than pipboy_ratio = Pip-Boy
aim_ratio=0.95
pipboy_ratio=0.5
; show the Pip-Boy and VATS/dialogue/3rd-person cameras on the 2D screen
pipboy_2d=1
other_cams_2d=1
; camera states shown in VR (others on the 2D screen): 0 first person, 7 third person (shares the animated-camera vtable)
vr_cam_states=0,7
