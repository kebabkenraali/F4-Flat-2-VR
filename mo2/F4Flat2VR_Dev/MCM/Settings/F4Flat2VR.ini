[stereo]
enabled=0
amp_units=30
period_sec=4

[engine]
enabled=1
mode=stereo
ipd_units=4.48
amp_units=30
period_sec=4
compensate=4
head_rotation=1
head_rot_compensate=0
head_position=1
units_per_meter=70
convergence_m=1.5
aim_ipd_scale=0.35
; world_scale multiplies BOTH the eye separation and the head translation:
; lower = the world looks bigger, higher = smaller. 1.0 = neutral.
world_scale=1.0
; use_runtime_ipd=1 takes the IPD straight from the headset (Prop_UserIpdMeters),
; so it adapts to whoever wears it. Set 0 to use ipd_units above instead.
use_runtime_ipd=1
; dialogue_back_m: pull the conversation camera back along its view axis (metres, 0 = off).
dialogue_back_m=0.4
; fp_fov_sync=1: weapon/hands FOV = world FOV in hipfire (fixes oversized weapon). 0 = engine value.
fp_fov_sync=1
; dialogue_fov: world FOV in conversations (0 = same as hipfire; lower = bigger NPC).
dialogue_fov=0
; dialogue_freeze=1: conversation view frozen (no head rotation/position, no eye alternation); use with dialogue_panel_full=1. 0 = head-tracked 3D view.
dialogue_freeze=0

[vr]
enabled=1
eye_delay=0
swap_eyes=0
wait_poses=1
flat_after_frames=20
screen_width_m=3.0
screen_distance_m=2.0
fov_bounds=1
; Save first-person hipfire and ADS eye textures once per state to the game folder.
; Each capture briefly waits for the GPU; leave disabled unless diagnosing rendering.
capture_aim_frames=0
; Capture hotkey (VK 46 = Delete): saves BMP screenshots of the eye textures / 2D screen to fo4stereo_shots (RenderDoc frame capture only if renderdoc.dll is loaded). 0 = off.
renderdoc_capture_key=46
no_vsync=1
; submit_with_pose=1: submit each eye with the HMD pose it was rendered with (fixes the lagging-eye double image in hipfire). 0 = old behaviour.
submit_with_pose=1
; ads_overlay=1: show aiming down sights as a head-locked overlay (no reprojection double image). 0 = eye textures.
ads_overlay=1
; ads_mode (start value; Insert cycles it live): 0 mono eye textures, 1 head-locked overlay, 2 stereo like hipfire.
ads_mode=1
ads_overlay_distance_m=4.0
; dialogue_panel=1: conversations as a head-locked screen (dialogue_panel_dist_m / _width_m / _y_m place it; _crop = u0,v0,u1,v1 of the frame).
dialogue_panel=1
; dialogue_panel_full=0: the 3D scene stays in VR and only the options are shown as a magnified centred panel (1 = whole frame as a flat frozen screen).
dialogue_panel_full=0
; dialogue_panel_gate=0: 1 hides the panel when no options are on screen. Off: panel stays up through the whole conversation (no flicker).
dialogue_panel_gate=0
dialogue_panel_dist_m=1.2
dialogue_panel_width_m=1.0
dialogue_panel_y_m=-0.10
dialogue_panel_crop=0.25,0.74,0.75,0.93
; reticle=1: own head-locked reticle (no game assets). Needs bCrosshairEnabled=0 in Fallout4Prefs.ini so the game crosshair is off.
reticle=1
reticle_dist_m=2.5
reticle_deg=3.0
reticle_yaw_deg=0
reticle_pitch_deg=0
auto_configure=1
aim_ratio=0.95
upscale=1
upscale_sharpness=0.1
pipboy_ratio=0.75
pipboy_2d=1
pipboy_projected=1
pipboy_screen_width_m=0.8
pipboy_screen_distance_m=2.0
pipboy_screen_height_m=-0.35
pipboy_target_index=0
other_cams_2d=1
; Camera states shown in stereo. 0 = first person only (3rd person/gamestates
; stay mono to avoid double vision where the eye offset is wrong).
vr_cam_states=0,7,12
; Head view offsets: OpenVR's seated recenter resets position and yaw but NOT pitch,
; so the view can stay slightly tilted/off-centre after recentering. Negative values
; tilt/turn the view; tune here or press the recenter key in game (see below).
head_yaw_offset_deg=0
head_pitch_offset_deg=0
; Recenter hotkey (Windows VK code, decimal). Press briefly in game: the current head
; direction becomes the new zero pose (cancels residual yaw AND pitch) and the 2D
; screen re-places itself. 35 = End (Delete 46 is the screenshot key; F9 = 120 conflicts with quickload), 0 = disabled. Gamepad: L3+R3 also recenters.
recenter_key=35
aim_headpos=0
; aim_headrot=0: while aiming down sights the view ignores head rotation so sights and barrel line up (1 = view follows the head).
aim_headrot=0
; HUD panels (docs/HUD_PLAN.md): game HUD cropped into head-locked panels. Needs fHUDOpacity=1.
hud_panels=0
hud_bg_alpha=0
hud_mask=0
hud_dist_m=1.2
hud_hp_crop=0.000,0.938,0.177,0.993
hud_hp_yaw_deg=-48.6
hud_hp_pitch_deg=-49.2
hud_ammo_crop=0.887,0.792,1.000,0.875
hud_ammo_yaw_deg=50.7
